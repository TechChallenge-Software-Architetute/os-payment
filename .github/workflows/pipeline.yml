name: os-payment pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - name: Run BDD and unit tests
        run: ./mvnw -B test

  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven
      - name: Generate JaCoCo report and run coverage gate
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  terraform-preflight:
    name: Terraform preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Format and validate Terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          printf 'environment = "develop"\n' > ci-placeholder.auto.tfvars
          terraform validate

  deploy:
    name: Build and deploy ECS worker
    runs-on: ubuntu-latest
    needs: [code-analysis, terraform-preflight]
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      ENVIRONMENT: ${{ github.ref_name }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_environment: ${{ github.ref_name }}
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      ECR_REPOSITORY: os-payment-${{ github.ref_name }}
      ECS_CLUSTER: os-payment-${{ github.ref_name }}
      ECS_SERVICE: os-payment-${{ github.ref_name }}
      ECS_TASK_FAMILY: os-payment-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "TF_STATE_BUCKET is not configured"; exit 1; }
          terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=os-payment/$ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Create ECR repository
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push worker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Apply Terraform and deploy worker
        working-directory: infra/terraform
        env:
          TF_VAR_image_tag: ${{ github.sha }}
        run: terraform apply -input=false -auto-approve

      - name: Register task definition with Mercado Pago token and restart service
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
        run: |
          test -n "$MERCADO_PAGO_ACCESS_TOKEN"
          echo "::add-mask::$MERCADO_PAGO_ACCESS_TOKEN"
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition --output json \
            | jq --arg token "$MERCADO_PAGO_ACCESS_TOKEN" '
                del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
                | .containerDefinitions |= map(
                    if .name == "os-payment" then
                      .environment = ((.environment // [] | map(select(.name != "MERCADO_PAGO_ACCESS_TOKEN"))) + [{name: "MERCADO_PAGO_ACCESS_TOKEN", value: $token}])
                    else . end
                  )
              ' > "$RUNNER_TEMP/os-payment-task-definition.json"
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/os-payment-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" --force-new-deployment
