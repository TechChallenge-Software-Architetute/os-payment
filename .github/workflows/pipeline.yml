name: "os-payment pipeline"

# Independent by design: no step reads another repository's Terraform state and no
# step waits on another repository's deploy. Every input is an explicit secret or
# a name derived from the branch.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:

  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  preflight:
    name: "Terraform preflight"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt & init (no backend)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false

      - name: Terraform validate (placeholders)
        run: |
          cat > ci-placeholder.auto.tfvars <<EOF
          environment = "develop"
          EOF
          terraform validate

  # ---------------------------------------------------------------------------
  # Build + deploy. The jar is built in this job because the Lambda resource
  # reads it from disk (filename + source_code_hash), the same way
  # os-management-lambda does it.
  # ---------------------------------------------------------------------------
  deploy:
    name: "Build & Terraform deploy"
    runs-on: ubuntu-latest
    needs: unit-test
    environment: ${{ github.ref_name }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      TF_VAR_environment: ${{ github.ref_name }}
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Package Lambda jar
        run: ./mvnw -B -DskipTests clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        working-directory: infra/terraform
        shell: bash
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET_${{ github.ref_name == 'main' && 'MAIN' || 'DEVELOP' }} is not configured."
            exit 1
          fi

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=os-payment/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Import existing AWS resources when state is empty
        working-directory: infra/terraform
        shell: bash
        run: |
          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import -input=false "$address" "$resource_id"
            fi
          }

          env_name="${{ github.ref_name }}"

          for pair in \
            "aws_sqs_queue.payment_requests_dlq:os-payment-${env_name}-payment-requests-dlq" \
            "aws_sqs_queue.payment_requests:os-payment-${env_name}-payment-requests"
          do
            address="${pair%%:*}"
            queue_name="${pair#*:}"
            queue_url=$(aws sqs get-queue-url --queue-name "$queue_name" --query 'QueueUrl' --output text 2>/dev/null || true)
            if [ -n "$queue_url" ] && [ "$queue_url" != "None" ]; then
              import_if_missing "$address" "$queue_url"
            fi
          done

          table_name="os-payment-${env_name}-payments"
          table_exists=$(aws dynamodb describe-table --table-name "$table_name" \
            --query 'Table.TableName' --output text 2>/dev/null || true)
          if [ -n "$table_exists" ] && [ "$table_exists" != "None" ]; then
            import_if_missing "aws_dynamodb_table.payments" "$table_name"
          fi

      - name: Terraform plan (save tfplan)
        working-directory: infra/terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan
