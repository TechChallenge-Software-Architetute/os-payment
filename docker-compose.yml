services:
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-3}
    ports: ["4566:4566"]
  queue-init:
    image: amazon/aws-cli:2.15.57
    depends_on: [localstack]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ENDPOINT=http://localstack:4566
        until aws --endpoint-url=$$ENDPOINT sqs list-queues >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url=$$ENDPOINT sqs create-queue --queue-name sqs-os-management >/dev/null
        aws --endpoint-url=$$ENDPOINT sqs create-queue --queue-name sqs-payment >/dev/null
        if ! aws --endpoint-url=$$ENDPOINT dynamodb describe-table --table-name payment_orders >/dev/null 2>&1; then
          aws --endpoint-url=$$ENDPOINT dynamodb create-table --table-name payment_orders \
            --attribute-definitions AttributeName=orderId,AttributeType=S AttributeName=status,AttributeType=S AttributeName=updatedAt,AttributeType=S \
            --key-schema AttributeName=orderId,KeyType=HASH \
            --global-secondary-indexes '[{"IndexName":"status-updatedAt-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"},{"AttributeName":"updatedAt","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
            --billing-mode PAY_PER_REQUEST >/dev/null
        elif [ "$(aws --endpoint-url=$$ENDPOINT dynamodb describe-table --table-name payment_orders --query "Table.GlobalSecondaryIndexes[?IndexName=='status-updatedAt-index'].IndexName | [0]" --output text)" != "status-updatedAt-index" ]; then
          aws --endpoint-url=$$ENDPOINT dynamodb update-table --table-name payment_orders \
            --attribute-definitions AttributeName=status,AttributeType=S AttributeName=updatedAt,AttributeType=S \
            --global-secondary-index-updates '[{"Create":{"IndexName":"status-updatedAt-index","KeySchema":[{"AttributeName":"status","KeyType":"HASH"},{"AttributeName":"updatedAt","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}}]' >/dev/null
        fi
        until [ "$(aws --endpoint-url=$$ENDPOINT dynamodb describe-table --table-name payment_orders --query "Table.GlobalSecondaryIndexes[?IndexName=='status-updatedAt-index'].IndexStatus | [0]" --output text)" = "ACTIVE" ]; do sleep 2; done
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-west-3}
  payment:
    build: .
    restart: unless-stopped
    depends_on:
      queue-init: {condition: service_completed_successfully}
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      SQS_ENDPOINT: http://localstack:4566
      DYNAMODB_ENDPOINT: http://localstack:4566
      DYNAMODB_PAYMENT_ORDERS_TABLE: payment_orders
      SQS_INPUT_QUEUE: sqs-os-management
      SQS_OUTPUT_QUEUE: sqs-payment
      PAYMENT_POLLING_FIXED_DELAY_MS: ${PAYMENT_POLLING_FIXED_DELAY_MS:-30000}
      PAYMENT_POLLING_BATCH_SIZE: ${PAYMENT_POLLING_BATCH_SIZE:-50}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_API_URL: ${MERCADO_PAGO_API_URL:-https://api.mercadopago.com}
    ports: ["8080:8080"]
